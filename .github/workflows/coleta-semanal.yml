name: "Coleta Semanal Automatizada"

on:
  schedule:
    - cron: "0 3 * * 0" # Domingos 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coleta-semanal
  cancel-in-progress: false

jobs:
  coleta:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write # commit dos dados atualizados

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Run coleta-camara
        run: python scripts/coleta-camara.py --limit 20

      - name: Run gerar-dashboard
        run: python scripts/gerar-dashboard.py

      - name: Commit changes (if any)
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "Sem mudancas nos dados."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "chore(data): atualizacao automatica semanal"
          git push
